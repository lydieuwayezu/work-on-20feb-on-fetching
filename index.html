<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dynamic Pokémon Fetcher</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>
</head>

<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-200 to-purple-300 dark:from-gray-900 dark:to-gray-800 transition duration-500">

  <div class="w-full max-w-md bg-white dark:bg-gray-900 shadow-2xl rounded-2xl p-6 transform transition-all duration-500 hover:scale-105">

    <!-- Header -->
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-2xl font-bold text-gray-800 dark:text-white">
        Pokémon Fetcher
      </h1>
      <button id="darkToggle"
        class="px-3 py-1 text-sm bg-gray-800 text-white rounded-lg dark:bg-yellow-400 dark:text-black transition">
        Toggle
      </button>
    </div>

    <!-- Input Section -->
    <div class="flex gap-2 mb-4">
      <input id="pokemonInput" type="text"
        placeholder="Enter Pokémon name or ID"
        class="flex-1 px-3 py-2 rounded-lg border focus:outline-none focus:ring-2 focus:ring-indigo-400 dark:bg-gray-800 dark:text-white" />

      <button id="searchBtn"
        class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition disabled:opacity-50">
        Search
      </button>
    </div>

    <!-- Loading Spinner -->
    <div id="loading" class="hidden flex justify-center my-4">
      <div class="w-8 h-8 border-4 border-indigo-600 border-dashed rounded-full animate-spin"></div>
    </div>

    <!-- Pokémon Display -->
    <div id="pokemonCard" class="text-center"></div>

  </div>

  <script src="script.js"></script>
</body>
</html>
